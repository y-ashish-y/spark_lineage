# Spark config — applies to every session inside the Jupyter container.
# Spline agent is wired via the query-execution listener and a REST dispatcher.
spark.sql.queryExecutionListeners                       za.co.absa.spline.harvester.listener.SplineQueryExecutionListener
spark.spline.lineageDispatcher                          http
spark.spline.lineageDispatcher.http.producer.url        http://spline-rest:8080/producer
spark.spline.lineageDispatcher.http.apiVersion         LATEST
spark.spline.mode                                       ENABLED

# Iceberg extension + hadoop catalog backed by a local warehouse directory.
spark.sql.extensions                                    org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.local                                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.local.type                            hadoop
spark.sql.catalog.local.warehouse                       /home/jovyan/data/warehouse
spark.sql.defaultCatalog                                local
spark.sql.catalog.spark_catalog                         org.apache.iceberg.spark.SparkSessionCatalog
spark.sql.catalog.spark_catalog.type                    hadoop
spark.sql.catalog.spark_catalog.warehouse               /home/jovyan/data/warehouse

# Capture non-persistent actions too, so show()/collect() also emit lineage.
spark.spline.plugins.za.co.absa.spline.harvester.plugin.embedded.NonPersistentActionsCapturePlugin.enabled   true

# Quieter spark logs when working through the tutorials.
spark.sql.adaptive.enabled                              true
spark.sql.shuffle.partitions                            4
